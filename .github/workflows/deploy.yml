name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile production entry points
        run: python -m py_compile app.py ifc_app/saas.py ifc_app/supabase_auth.py ifc_protocol.py
      - name: Run deployment-critical tests
        run: >-
          python -m pytest
          tests/test_auth_routes.py
          tests/test_ifc_protocol.py
          tests/test_public_pages.py
          tests/test_runtime_startup.py
          tests/test_session_upload_route_alignment.py
          tests/test_cobie_qa_checker.py
          tests/test_deployment_hardening.py
          tests/test_session_retention_security.py
          -q
      - name: Block tracked local secret files
        run: python scripts/check_tracked_secrets.py
