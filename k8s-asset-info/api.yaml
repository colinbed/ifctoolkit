apiVersion: v1
kind: Service
metadata:
  name: asset-info-api
  namespace: asset-info
spec:
  selector:
    app: asset-info-api
  ports:
    - port: 80
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: asset-info-api
  namespace: asset-info
spec:
  replicas: 1
  selector:
    matchLabels:
      app: asset-info-api
  template:
    metadata:
      labels:
        app: asset-info-api
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      initContainers:
        - name: migrate
          image: ghcr.io/colinbed/ifctoolkit-asset-info:latest
          command: ["alembic", "upgrade", "head"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: asset-info-postgres
                  key: DATABASE_URL
      containers:
        - name: asset-info-api
          image: ghcr.io/colinbed/ifctoolkit-asset-info:latest
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: asset-info-postgres
                  key: DATABASE_URL
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8000
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
